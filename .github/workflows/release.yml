name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate version tag and prepare notes
        run: |
          node --import tsx --input-type=module <<'NODE'
          import { readFileSync, mkdirSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { changelogSection, unwrapMarkdown } from './scripts/release.ts';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag) || tag !== `v${version}`) throw Error('Tag must match package.json');
          const git = args => execFileSync('git', args, { encoding: 'utf8' }).trim();
          if (git(['rev-parse', `refs/tags/${tag}^{commit}`]) !== git(['rev-parse', 'HEAD'])) throw Error('Checkout must match the existing tag');
          git(['merge-base', '--is-ancestor', 'HEAD', 'origin/main']);
          const notes = changelogSection(readFileSync('CHANGELOG.vi.md', 'utf8'), version);
          if (!notes) throw Error('Vietnamese release notes missing for this version');
          mkdirSync('dist/release-notes', { recursive: true });
          writeFileSync('dist/release-notes/notes.md', unwrapMarkdown(notes) + '\n');
          NODE
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: dist/release-notes/notes.md
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Test native Windows hooks and Desktop integration contracts
        run: npm test -- --maxWorkers=2 server/test/antigravity-hook.test.ts shared/i18n-windows.test.ts shared/i18n.test.ts server/test/i18n.test.ts server/sources/antigravity server/permissions server/messages client/src/ui/permission.test.ts client/src/ui/composer-model.test.ts server/http/http.test.ts server/http/terminal.test.ts
      - name: Locate NSIS
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $nsis)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if (-not (Test-Path -LiteralPath $nsis)) { throw 'NSIS not found' }
          "MAKENSIS=$nsis" >> $env:GITHUB_ENV
      - run: npm run build:windows
      - run: node scripts/check-windows-package.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            dist/windows/*.exe
            dist/windows/*.exe.sha256
            dist/windows/payload/README.vi.txt
            dist/windows/payload/dist/build.json

  publish:
    needs: [verify, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Verify and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir assets
          cp artifacts/*.exe artifacts/*.exe.sha256 assets/
          cp artifacts/payload/README.vi.txt artifacts/payload/dist/build.json assets/
          (cd assets && sha256sum --check *.sha256)
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            if ! node -e 'if (!JSON.parse(require("fs").readFileSync("release-state.json")).isDraft) process.exit(1)'; then
              echo 'Release is already published; preserving its assets.'
              exit 0
            fi
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft "${flags[@]}" --title "Habblaud $RELEASE_TAG" --notes-file notes/notes.md
          fi
          gh release upload "$RELEASE_TAG" assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
